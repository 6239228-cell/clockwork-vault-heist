<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Clockwork Vault — 齿轮金库</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03080c; }
  body { display: grid; place-items: center; }
  #game {
    display: block;
    width: min(100vw, calc(100vh * 1.6));
    height: min(100vh, calc(100vw / 1.6));
    background: #050b11;
    touch-action: none;
    cursor: crosshair;
    outline: none;
    box-shadow: 0 0 80px rgba(20, 70, 90, 0.35);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"
  aria-label="The Clockwork Vault: a top-down heist. Steer the thief with WASD or the arrow keys, hold Shift to sprint, click to throw a coin, grab the gold bar and return to the getaway van while dodging guards, cameras and lasers."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
